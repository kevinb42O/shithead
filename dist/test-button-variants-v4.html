<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Serif; src: url(display.ttf); }
@font-face { font-family: DM; src: url(body.ttf); }
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px;
  background: radial-gradient(ellipse at 50% 30%, #35634744, #0a271b99), url(assets/bottle-green-table.jpg), #173e32;
  background-size: cover;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  font-family: Serif;
}
.row {
  display: flex;
  align-items: center;
  gap: 20px;
}
.label {
  color: #d1dfc0;
  font-family: DM, sans-serif;
  font-size: 13px;
  width: 280px;
  text-align: right;
}

/* Original */
.btn-orig {
  width: 248px;
  height: 62px;
  padding: 0 40px;
  border: 0;
  border-radius: 16px;
  background: url(assets/royal-button.png) center / 100% 169% no-repeat;
  color: #fff0ce;
  font: 24px/1 Serif, serif;
  letter-spacing: .01em;
  text-shadow: 0 2px 3px #001e15;
  filter: drop-shadow(0 5px 5px #00150db3);
}

/* Base button with exact centering */
.royal-btn-base {
  width: 248px;
  height: 62px;
  border: 0;
  border-radius: 16px;
  background: url(assets/royal-button.png) center / 100% 169% no-repeat;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  filter: drop-shadow(0 6px 7px #00150dcc);
  text-decoration: none;
  transition: transform 180ms cubic-bezier(.16,1,.3,1), filter 180ms;
}

/* 1. Title Case: Sculpted Royal Ivory & Gold Inlay */
.btn-opt-1 {
  padding: 0 42px 5px;
  font-family: Serif, Georgia, serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #fff6dc;
  text-shadow:
    0 -1px 0 rgba(255, 255, 255, 0.45),
    0 1px 1px rgba(245, 220, 160, 0.3),
    0 2px 4px #00120a,
    0 3px 6px rgba(0, 10, 5, 0.95);
}

/* 2. All Caps: Sculpted Royal Ivory & Gold Inlay */
.btn-opt-2 {
  padding: 0 40px 3px calc(40px + 0.14em);
  font-family: Serif, Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: #fae9bf;
  text-shadow:
    0 -1px 0 rgba(255, 255, 255, 0.45),
    0 1px 1px rgba(255, 235, 180, 0.3),
    0 2px 4px #00120a,
    0 3px 7px rgba(0, 10, 5, 0.95);
}

/* 3. Title Case: Metallic Gold Leaf Gradient */
.btn-opt-3 {
  padding: 0 42px 5px;
}
.btn-opt-3 .label-span {
  font-family: Serif, Georgia, serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.04em;
  background: linear-gradient(180deg, #ffffff 0%, #fff3d8 28%, #f3d185 68%, #c5983c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 3px rgba(0, 14, 8, 0.95)) drop-shadow(0 1px 1px rgba(0, 0, 0, 0.75));
}

/* 4. All Caps: Metallic Gold Leaf Gradient */
.btn-opt-4 {
  padding: 0 40px 3px calc(40px + 0.14em);
}
.btn-opt-4 .label-span {
  font-family: Serif, Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  background: linear-gradient(180deg, #ffffff 0%, #fff4da 26%, #f5d48c 65%, #c89c42 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 3px rgba(0, 14, 8, 0.95)) drop-shadow(0 1px 1px rgba(0, 0, 0, 0.75));
}

/* 5. Title Case: Antique Gold with Warm Ambient Glow */
.btn-opt-5 {
  padding: 0 42px 5px;
  font-family: Serif, Georgia, serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #fff9e6;
  text-shadow:
    0 0 10px rgba(245, 218, 145, 0.35),
    0 -1px 0 rgba(255, 255, 255, 0.5),
    0 1px 2px rgba(0, 0, 0, 0.8),
    0 2px 5px #00120a,
    0 3px 8px rgba(0, 8, 4, 0.95);
}

/* 6. All Caps: Antique Gold with Warm Ambient Glow */
.btn-opt-6 {
  padding: 0 40px 3px calc(40px + 0.14em);
  font-family: Serif, Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: #fae8c0;
  text-shadow:
    0 0 10px rgba(245, 218, 145, 0.35),
    0 -1px 0 rgba(255, 255, 255, 0.5),
    0 1px 2px rgba(0, 0, 0, 0.8),
    0 2px 5px #00120a,
    0 3px 8px rgba(0, 8, 4, 0.95);
}
</style>
</head>
<body>
  <div class="row">
    <div class="label">Current original:</div>
    <button class="btn-orig">Start game</button>
  </div>
  <div class="row">
    <div class="label">1. Title Case Ivory & Gold:</div>
    <button class="royal-btn-base btn-opt-1">Start Game</button>
  </div>
  <div class="row">
    <div class="label">2. All-Caps Ivory & Gold:</div>
    <button class="royal-btn-base btn-opt-2">START GAME</button>
  </div>
  <div class="row">
    <div class="label">3. Title Case Gold Gradient:</div>
    <button class="royal-btn-base btn-opt-3"><span class="label-span">Start Game</span></button>
  </div>
  <div class="row">
    <div class="label">4. All-Caps Gold Gradient:</div>
    <button class="royal-btn-base btn-opt-4"><span class="label-span">START GAME</span></button>
  </div>
  <div class="row">
    <div class="label">5. Title Case Gold Glow:</div>
    <button class="royal-btn-base btn-opt-5">Start Game</button>
  </div>
  <div class="row">
    <div class="label">6. All-Caps Gold Glow:</div>
    <button class="royal-btn-base btn-opt-6">START GAME</button>
  </div>
</body>
</html>
